# A static site with no server: the app renders in the browser, so any path
# that is not a file falls back to the app shell.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types application/json application/javascript text/css image/svg+xml;
	gzip_min_length 1024;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# Built JS and CSS carry a content hash in their names.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options nosniff always;
	}

	# The sets' data changes with each release; let browsers revalidate.
	location /data/ {
		add_header Cache-Control "public, max-age=300";
		add_header X-Content-Type-Options nosniff always;
	}

	location / {
		try_files $uri $uri/ /404.html;
	}
}
