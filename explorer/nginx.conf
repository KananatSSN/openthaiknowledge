# The site is static: the app renders in the browser, so any path that is not
# a file falls back to the app shell. The one exception is /api/, the PDF
# sheets, which the "sheets" container draws.

# The visitor's address: Cloudflare's header when the request came through the
# tunnel, the connecting address otherwise. The sheets server limits per address.
map $http_cf_connecting_ip $client_ip {
	"" $remote_addr;
	default $http_cf_connecting_ip;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types application/json application/javascript text/css image/svg+xml;
	gzip_min_length 1024;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# Built JS and CSS carry a content hash in their names.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options nosniff always;
	}

	# The sets' data changes with each release; let browsers revalidate.
	location /data/ {
		add_header Cache-Control "public, max-age=300";
		add_header X-Content-Type-Options nosniff always;
	}

	location /api/ {
		proxy_pass http://sheets:8000;
		proxy_set_header X-Client-IP $client_ip;
		proxy_read_timeout 60s;
		# The sheets server sends its own Cache-Control: no-store.
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
	}

	location / {
		try_files $uri $uri/ /404.html;
	}
}
