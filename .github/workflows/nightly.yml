name: Nightly

# The thousand-seed quality gates (tests marked `slow`) draw 1,000 questions per
# set to catch rare bad draws and measure variety. They are too slow for every
# push, so they run here once a day and on demand.

on:
  schedule:
    - cron: "0 19 * * *"    # 02:00 Bangkok time
  workflow_dispatch:

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Thai fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-thai-tlwg fontconfig

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Thousand-seed quality gates
        run: python -m pytest otk/tests -q -n auto -m slow
