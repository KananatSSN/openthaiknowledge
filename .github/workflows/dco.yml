name: Sign-off

# Every commit in a pull request certifies the Developer Certificate of Origin
# with a `Signed-off-by:` line matching its author (`git commit -s`).

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format=%B "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is not signed off by $author"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git commit --amend -s (or git rebase --signoff $BASE)"
            exit 1
          fi
